name: Code Coverage

on:
  push:
    branches: ['main', 'master', 'develop']
  pull_request:
    branches: ['main', 'master', 'develop']

jobs:
  coverage:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.33
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: simplebugdettracker
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with coverage instrumentation
        run: npm run webapp:build:e2e

      - name: Start application
        run: |
          ./mvnw -ntp &
          npx wait-on -t 60000 http://localhost:8080

      - name: Run tests with coverage
        run: npm run e2e:cypress:coverage

      - name: Generate coverage report
        run: npm run ci:e2e:coverage:report

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./target/cypress/coverage/lcov.info
          flags: e2e
          name: codecov-umbrella
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
