name: Application CI
on: [push, pull_request]
jobs:
  pipeline:
    name: simpleBudgetTracker pipeline
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.pull_request.title, '[skip ci]') && !contains(github.event.pull_request.title, '[ci skip]')"
    timeout-minutes: 40
    env:
      NODE_VERSION: 22.15.0
      SPRING_OUTPUT_ANSI_ENABLED: DETECT
      SPRING_JPA_SHOW_SQL: false
      JHI_DISABLE_WEBPACK_LOGS: true
      NODE_ENV: test # Enable coverage instrumentation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      # Cache dependencies
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node.js packages
        run: npm install

      - name: Run backend test
        run: |
          chmod +x mvnw
          npm run ci:backend:test

      - name: Run frontend test
        run: npm run ci:frontend:test

      # Build frontend with coverage instrumentation
      - name: Build frontend with coverage
        run: npm run webapp:build:e2e

      # Package application with instrumented code
      - name: Package for E2E tests
        run: npm run ci:e2e:package

      - name: 'E2E: Prepare'
        run: npm run ci:e2e:prepare

      # Run E2E tests with coverage
      - name: 'E2E: Run with coverage'
        run: npm run e2e:cypress:coverage
        env:
          CYPRESS_ENABLE_RECORD: false
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

      # Merge all coverage reports
      - name: Merge coverage reports
        if: always()
        run: |
          mkdir -p .nyc_output
          npx nyc merge .nyc_output coverage/cypress/.nyc_output/out.json
          npx nyc report --reporter=lcov --reporter=text-summary --report-dir coverage/merged

      # Upload to Codecov
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage/merged
          flags: e2e,frontend
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      # Upload coverage as artifact
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/merged
            coverage/cypress
          retention-days: 14

      - name: 'E2E: Teardown'
        if: always()
        run: npm run ci:e2e:teardown
