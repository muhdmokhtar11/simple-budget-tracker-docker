name: Application CI

on: [push, pull_request]

jobs:
  pipeline:
    name: simpleBudgetTracker pipeline
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.pull_request.title, '[skip ci]') && !contains(github.event.pull_request.title, '[ci skip]')"
    timeout-minutes: 40
    env:
      NODE_VERSION: 22.15.0
      SPRING_OUTPUT_ANSI_ENABLED: DETECT
      SPRING_JPA_SHOW_SQL: false
      JHI_DISABLE_WEBPACK_LOGS: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Node.js packages
        run: npm install

      - name: Run backend test
        run: |
          chmod +x mvnw
          npm run ci:backend:test

      - name: Build frontend with coverage instrumentation
        run: INSTRUMENT=true npm run build

      - name: Start frontend server (background)
        run: npm run start:instrumented &
        env:
          PORT: 3000

      - name: Wait for app to be available
        run: |
          npx wait-on http://localhost:3000

      - name: Run Cypress E2E tests
        run: npm run ci:e2e:run
        env:
          CYPRESS_ENABLE_RECORD: false
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

      - name: Generate Cypress Coverage Report
        if: always()
        run: |
          npx nyc report --reporter=lcov --report-dir=target/cypress/coverage
          npx nyc report --reporter=html --report-dir=target/cypress/coverage

      - name: Upload Test Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage-reports
          path: |
            target/cypress/coverage
            target/test-results
          retention-days: 30

      - name: E2E Teardown
        run: npm run ci:e2e:teardown
